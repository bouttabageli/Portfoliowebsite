    <main class="catalog-main">
        <section class="catalog-header">
            <h2>Web Arcade</h2>
            <p>Playable prototypes and projects running directly in the browser.</p>
        </section>

        <!-- Container populated by JS -->
        <div class="games-grid" id="games-grid"></div>
    </main>

    <script src="js/games-catalog.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("games-grid");

            Object.entries(GAMES_CATALOG).forEach(([key, game]) => {
            const card = document.createElement("div");
            card.className = "game-card";
            card.innerHTML = `
                <h3>${game.title}</h3>
                <p>${game.description}</p>
                <a href="play.html?game=${key}" class="play-btn">Play Now</a>
            `;
            grid.appendChild(card);
            });
        });
    </script>

</body>
